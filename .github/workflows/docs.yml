name: Build documentation
on:
  pull_request:
    paths: ['docs/**', 'README.md', '*.md', 'mkdocs.yml', 'tools/build-docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'mkdocs==1.6.1'
      - run: python tools/build-docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
# This workflow builds an artifact only. Add a protected deployment job after
# repository ownership and GitHub Pages settings have been confirmed.
